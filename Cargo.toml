[package]
name = "pica"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Pica is a virtual UWB Controller implementing the FiRa UCI specification."
repository = "https://github.com/google/pica"
license = "Apache-2.0"
readme = "README.md"
keywords = ["uwb", "virtual", "emulator", "controller"]
categories = ["emulators", "virtualization"]
authors = [
  "Adrien Larbanet",
  "Charlie Boutier <charliebout@google.com>",
  "David De Jesus Duarte <licorne@google.com>",
  "Henri Chataing <henrichataing@google.com>",
]
default-run = "pica"
exclude = [
  "res/*",
  "scripts/*"
]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pica"
path = "src/lib.rs"

[[bin]]
name = "pica"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "pica-http"
path = "src/bin/http-server/main.rs"
required-features = ["web"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cast_lossless = "warn"
indexing_slicing = "deny"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_for_each = "warn"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unreadable_literal = "warn"
unwrap_used = "deny"

[features]
default = ["cli", "web"]
ffi = []
log = ["tracing/log"]
serde = ["dep:serde"]
tokio = ["dep:tokio"]
cli = [
  "dep:clap",
  "dep:parking_lot",
  "dep:tracing-subscriber",
  "tokio",
  "tokio/macros",
  "tokio/rt",
  "tokio/sync",
  "tokio/time",
]
web = [
  "dep:clap",
  "dep:glam",
  "dep:hyper",
  "dep:parking_lot",
  "dep:serde_json",
  "dep:tokio-stream",
  "dep:tracing-subscriber",
  "serde",
  "tokio",
  "tokio/macros",
  "tokio/rt-multi-thread",
  "tokio/sync",
  "tokio/time",
]

[build-dependencies]
pdl-compiler = "0.5.2"

[dependencies]
bytes = "1"
clap = { version = "4.1.8", default-features = false, features = ["derive", "error-context", "help", "std", "usage"], optional = true }
glam = { version = "0.25.0", optional = true }
hex = "0.4.3"
hyper = { version = "0.14", features = ["server", "stream", "http1", "tcp"], optional = true }
parking_lot = { version = "0.12", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
pdl-runtime = "0.5.2"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0.49"
tokio = { version = "1.32.0", features = ["io-util", "net"], optional = true }
tokio-stream = { version = "0.1.8", features = ["sync"], optional = true }
