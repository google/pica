[package]
name = "pica"
version = "0.1.12"
edition = "2024"
description = "Pica is a virtual UWB Controller implementing the FiRa UCI specification."
repository = "https://github.com/google/pica"
license = "Apache-2.0"
readme = "README.md"
keywords = ["uwb", "virtual", "emulator", "controller"]
categories = ["emulators", "virtualization"]
authors = [
  "Adrien Larbanet",
  "Charlie Boutier <charliebout@google.com>",
  "David De Jesus Duarte <licorne@google.com>",
  "Henri Chataing <henrichataing@google.com>",
]
default-run = "pica"
exclude = [
  "res/*",
  "scripts/*"
]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pica"
path = "src/lib.rs"

[[bin]]
name = "pica"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "pica-http"
path = "src/bin/http-server/main.rs"
required-features = ["web"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde"))'] }

[features]
default = ["cli", "web"]
cli = [
  "dep:clap",
  "dep:env_logger",
]
web = [
  "dep:clap",
  "dep:glam",
  "dep:hyper",
  "dep:serde_json",
  "dep:tokio-stream",
  "tokio/rt-multi-thread",
]

[build-dependencies]
pdl-compiler = "0.3.2"

[dependencies]
anyhow = "1.0.56"
bytes = "1"
futures = "0.3.30"
clap = { version = "4.1.8", default-features = false, features = ["derive", "error-context", "help", "std", "usage"], optional = true }
glam = { version = "0.25.0", optional = true }
hex = "0.4.3"
hyper = { version = "0.14", features = ["server", "stream", "http1", "tcp"], optional = true }
log = "0.4.20"
env_logger = { version = "0.11.1", optional = true }
pdl-runtime = "0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0.49"
tokio = { version = "1.32.0", features = [ "fs", "io-util", "macros", "net", "rt", "sync", "time" ] }
tokio-stream = { version = "0.1.8", features = ["sync"], optional = true }
