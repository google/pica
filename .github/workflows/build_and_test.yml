name: Build, Check, Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  PY_COLORS: "1"

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build, Check, Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Install Rust 1.88.0
      uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0
      with:
        toolchain: 1.88.0
        targets: ""
        components: rustfmt, clippy
    - name: Build
      run: cargo build
    - name: Test
      run: cargo test --all-features
    - name: Fmt
      run: cargo fmt --check --quiet
    - name: Clippy
      run: cargo clippy --all-targets --all-features --no-deps -- --deny warnings
